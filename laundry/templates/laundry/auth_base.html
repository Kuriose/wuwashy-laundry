<script>
  // tombol tampil/sembunyikan password (berlaku untuk setiap kolom password)
  document.querySelectorAll('.toggle-pw').forEach(btn => {
    const input = btn.closest('.input').querySelector('input');
    btn.addEventListener('click', () => {
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.setAttribute('aria-pressed', show);
      btn.setAttribute('aria-label', show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
      btn.querySelector('use').setAttribute('href', show ? '#i-eye' : '#i-eye-off');
    });
  });
</script>
<script>
  // foto login bergeser sendiri (kanan ke kiri) tiap beberapa detik; titik di bawahnya ikut berpindah
  (function () {
    const slides = Array.from(document.querySelectorAll('.auth-photo .slide'));
    const dots = Array.from(document.querySelectorAll('.auth-dots span'));
    if (slides.length < 2) return;
    let i = 0, timer;
    slides.forEach((s, k) => { s.style.transform = 'translateX(' + (k === 0 ? 0 : 100) + '%)'; });
    function go(next) {
      if (next === i) return;
      const cur = slides[i], nxt = slides[next];
      nxt.style.transition = 'none';
      nxt.style.transform = 'translateX(100%)';
      void nxt.offsetWidth;
      cur.style.transition = nxt.style.transition = 'transform .45s ease';
      cur.style.transform = 'translateX(-100%)';
      nxt.style.transform = 'translateX(0)';
      i = next;
      dots.forEach((d, k) => d.classList.toggle('on', k === i));
    }
    function start() { clearInterval(timer); timer = setInterval(() => go((i + 1) % slides.length), 3400); }
    dots.forEach((d, k) => d.addEventListener('click', () => { go(k); start(); }));
    start();
  })();
</script>
